<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spot the Difference — Atelier Edition</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171f27;
    --panel-2: #1e2833;
    --border: #2c3a47;
    --text: #eef3f8;
    --muted: #8fa3b8;
    --accent: #f59e0b;
    --accent-2: #38bdf8;
    --ok: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #18222d 0%, var(--bg) 65%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 18px 24px;
  }
  header {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 18px;
    margin-bottom: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  .brand span { font-size: 12px; color: var(--accent); background: rgba(245,158,11,0.12); padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(245,158,11,0.35); }
  .hud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .stat {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat strong { font-size: 15px; color: var(--accent-2); font-variant-numeric: tabular-nums; }
  .stat.remain strong { color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease;
  }
  button:hover, select:hover { border-color: var(--accent-2); background: #24313f; }
  button:active { transform: scale(0.97); }
  button.primary { background: rgba(56,189,248,0.15); border-color: var(--accent-2); color: #bae6fd; }
  button.hint-btn { background: rgba(245,158,11,0.14); border-color: rgba(245,158,11,0.45); color: #fde68a; }

  .stage-wrap {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 820px) {
    .stage-wrap { grid-template-columns: 1fr; }
  }
  .board {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.4);
  }
  .board-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin: 0 4px 8px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .canvas-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 10px;
    overflow: hidden;
    cursor: crosshair;
    background: #0b0f14;
  }
  .canvas-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .ring {
    position: absolute;
    width: 44px;
    height: 44px;
    margin-left: -22px;
    margin-top: -22px;
    border-radius: 50%;
    border: 3px solid var(--ok);
    box-shadow: 0 0 0 3px rgba(34,197,94,0.28), 0 0 16px rgba(34,197,94,0.65);
    pointer-events: none;
    animation: pop 0.28s cubic-bezier(.22,1,.36,1);
  }
  .hint-ring {
    position: absolute;
    width: 58px;
    height: 58px;
    margin-left: -29px;
    margin-top: -29px;
    border-radius: 50%;
    border: 3px dashed var(--accent);
    pointer-events: none;
    animation: pulse 1s ease-in-out 3;
  }
  .miss-mark {
    position: absolute;
    width: 24px;
    height: 24px;
    margin-left: -12px;
    margin-top: -12px;
    color: var(--bad);
    font-weight: 900;
    font-size: 20px;
    line-height: 24px;
    text-align: center;
    pointer-events: none;
    animation: fadeout 0.6s ease forwards;
  }
  @keyframes pop {
    0% { transform: scale(1.7); opacity: 0.2; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.95; }
    50% { transform: scale(1.25); opacity: 0.35; }
  }
  @keyframes fadeout {
    0% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0; }
  }

  .footer-bar {
    width: 100%;
    max-width: 1200px;
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .dots { display: flex; gap: 7px; align-items: center; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #273444; border: 1px solid #3f5268;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .dot.found { background: var(--ok); border-color: #86efac; transform: scale(1.15); }
  .banner {
    display: none;
    margin-top: 12px;
    width: 100%;
    max-width: 1200px;
    background: linear-gradient(135deg, rgba(34,197,94,0.16), rgba(56,189,248,0.14));
    border: 1px solid rgba(34,197,94,0.5);
    border-radius: 12px;
    padding: 14px 18px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .banner.show { display: flex; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Spot the Difference</h1>
      <span id="sceneTag">Level 1 / 3</span>
    </div>
    <div class="hud">
      <div class="stat remain">Remaining: <strong id="remainCount">7</strong></div>
      <div class="stat">Found: <strong id="foundCount">0 / 7</strong></div>
      <div class="stat">Time: <strong id="timer">00:00</strong></div>
      <div class="stat">Score: <strong id="score">0</strong></div>
    </div>
    <div class="controls">
      <select id="levelSelect" aria-label="Select Level">
        <option value="0">1. Alchemist's Study</option>
        <option value="1">2. Midnight Station</option>
        <option value="2">3. Coral Observatory</option>
      </select>
      <button class="hint-btn" id="hintBtn">Hint (H)</button>
      <button id="resetBtn">Reset (R)</button>
      <button class="primary" id="soundBtn">Sound: On</button>
    </div>
  </header>

  <main class="stage-wrap">
    <section class="board">
      <div class="board-label"><span>Original Scene</span><span>Left</span></div>
      <div class="canvas-box" id="boxLeft"></div>
    </section>
    <section class="board">
      <div class="board-label"><span>Spot the Changes</span><span>Right</span></div>
      <div class="canvas-box" id="boxRight"></div>
    </section>
  </main>

  <div class="banner" id="winBanner">
    <div>
      <strong style="font-size:16px;color:#86efac;">Level Complete!</strong>
      <span id="winSummary" style="margin-left:8px;color:#d1fae5;font-size:14px;"></span>
    </div>
    <button class="primary" id="nextLevelBtn">Next Level →</button>
  </div>

  <footer class="footer-bar">
    <div class="dots" id="progressDots"></div>
    <div id="statusMsg">Click any difference on either image. Press H for a hint, R to restart.</div>

let audioCtx = null;

const boxLeft = document.getElementById("boxLeft");
const boxRight = document.getElementById("boxRight");
const remainEl = document.getElementById("remainCount");
const foundEl = document.getElementById("foundCount");
const timerEl = document.getElementById("timer");
const scoreEl = document.getElementById("score");
const sceneTag = document.getElementById("sceneTag");
const statusMsg = document.getElementById("statusMsg");
const dotsEl = document.getElementById("progressDots");
const winBanner = document.getElementById("winBanner");
const winSummary = document.getElementById("winSummary");
const levelSelect = document.getElementById("levelSelect");

function beep(freq, dur, type = "sine") {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch {}
}

function renderLevel(idx) {
  levelIdx = idx;
  foundIds = new Set();
  seconds = 0;
  winBanner.classList.remove("show");
  levelSelect.value = String(idx);
  const lvl = LEVELS[idx];
  sceneTag.textContent = `Level ${idx + 1} / ${LEVELS.length}`;

  const leftLayers = lvl.diffs.map(d => d.left).join("");
  const rightLayers = lvl.diffs.map(d => d.right).join("");

  boxLeft.innerHTML = `<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">${lvl.bg}${leftLayers}</svg>`;
  boxRight.innerHTML = `<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">${lvl.bg}${rightLayers}</svg>`;

  dotsEl.innerHTML = lvl.diffs.map(d => `<div class="dot" data-id="${d.id}" title="${d.label}"></div>`).join("");
  updateHud();
  statusMsg.textContent = `Spot all ${lvl.diffs.length} differences in "${lvl.name}".`;

  clearInterval(timerId);
  timerId = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
  timerEl.textContent = "00:00";
}

function updateHud() {
  const total = LEVELS[levelIdx].diffs.length;
  const found = foundIds.size;
  remainEl.textContent = String(total - found);
  foundEl.textContent = `${found} / ${total}`;
  scoreEl.textContent = String(score);
  for (const dot of dotsEl.querySelectorAll(".dot")) {
    dot.classList.toggle("found", foundIds.has(dot.dataset.id));
  }
}

function placeRing(box, xPct, yPct, cls = "ring") {
  const el = document.createElement("div");
  el.className = cls;
  el.style.left = `${xPct}%`;
  el.style.top = `${yPct}%`;
  box.appendChild(el);
  return el;
}

function handleBoardClick(e, box) {
  const rect = box.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 600;
  const y = ((e.clientY - rect.top) / rect.height) * 450;
  const lvl = LEVELS[levelIdx];

  for (const d of lvl.diffs) {
    if (foundIds.has(d.id)) continue;
    const dist = Math.hypot(x - d.x, y - d.y);
    if (dist <= d.r) {
      foundIds.add(d.id);
      score += 100;
      beep(660, 0.12, "triangle");
      setTimeout(() => beep(880, 0.14, "triangle"), 70);
      const xPct = (d.x / 600) * 100;
      const yPct = (d.y / 450) * 100;
      placeRing(boxLeft, xPct, yPct);
      placeRing(boxRight, xPct, yPct);
      statusMsg.textContent = `Found: ${d.label}!`;
      updateHud();

      if (foundIds.size === lvl.diffs.length) {
        clearInterval(timerId);
        score += Math.max(50, 300 - seconds * 2);
        updateHud();
        winSummary.textContent = `Cleared in ${timerEl.textContent} • Total Score: ${score}`;
        winBanner.classList.add("show");
      }
      return;
    }
  }

  // Miss click
  score = Math.max(0, score - 10);
  updateHud();
  beep(180, 0.12, "sawtooth");
  const miss = document.createElement("div");
  miss.className = "miss-mark";
  miss.textContent = "✕";
  miss.style.left = `${((e.clientX - rect.left) / rect.width) * 100}%`;
  miss.style.top = `${((e.clientY - rect.top) / rect.height) * 100}%`;
  box.appendChild(miss);
  setTimeout(() => miss.remove(), 620);
  statusMsg.textContent = "Nothing different there (-10 pts).";
}

function triggerHint() {
  const lvl = LEVELS[levelIdx];
  const next = lvl.diffs.find(d => !foundIds.has(d.id));
  if (!next) return;
  score = Math.max(0, score - 25);
  updateHud();
  beep(520, 0.15, "sine");
  const xPct = (next.x / 600) * 100;
  const yPct = (next.y / 450) * 100;
  const h1 = placeRing(boxLeft, xPct, yPct, "hint-ring");
  const h2 = placeRing(boxRight, xPct, yPct, "hint-ring");
  setTimeout(() => { h1.remove(); h2.remove(); }, 3000);
  statusMsg.textContent = `Hint: Look near "${next.label}" (-25 pts).`;
}

boxLeft.addEventListener("click", e => handleBoardClick(e, boxLeft));
boxRight.addEventListener("click", e => handleBoardClick(e, boxRight));
document.getElementById("hintBtn").addEventListener("click", triggerHint);
document.getElementById("resetBtn").addEventListener("click", () => renderLevel(levelIdx));
document.getElementById("soundBtn").addEventListener("click", e => {
  soundOn = !soundOn;
  e.target.textContent = `Sound: ${soundOn ? "On" : "Off"}`;
});
levelSelect.addEventListener("change", e => renderLevel(Number(e.target.value)));
document.getElementById("nextLevelBtn").addEventListener("click", () => {
  renderLevel((levelIdx + 1) % LEVELS.length);
});
window.addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") triggerHint();
  if (e.key === "r" || e.key === "R") renderLevel(levelIdx);
});

renderLevel(0);
</script>
</body>
</html>
